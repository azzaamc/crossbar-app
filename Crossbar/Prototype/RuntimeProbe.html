<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    html, body { height: 100%; margin: 0; background: #000; color: #fff; font: 16px -apple-system, sans-serif; }
    main { position: relative; width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #message { position: absolute; inset: auto 16px 16px; padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,.65); }
  </style>
</head>
<body>
  <main>
    <video id="localVideo" autoplay muted playsinline></video>
    <div id="message">Runtime loading…</div>
  </main>
  <script>
    (() => {
      'use strict';

      const video = document.getElementById('localVideo');
      const message = document.getElementById('message');
      let stream = null;
      let facingMode = 'user';

      const emit = (type, details = {}) => {
        window.webkit.messageHandlers.crossbar.postMessage({ type, ...details });
      };

      const show = text => { message.textContent = text; };

      const stopStream = () => {
        if (!stream) return;
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        video.srcObject = null;
      };

      const acquire = async videoEnabled => {
        stopStream();
        const constraints = {
          audio: true,
          video: videoEnabled ? { facingMode: { ideal: facingMode } } : false
        };
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();
        emit('permissionStateChanged', { camera: videoEnabled ? 'granted' : 'unused', microphone: 'granted' });
        emit('localMediaReady', {
          audioTracks: stream.getAudioTracks().length,
          videoTracks: stream.getVideoTracks().length
        });
      };

      const commands = {
        async join(payload) {
          emit('joining', { callID: payload.callID });
          show('Requesting local media…');
          await acquire(payload.video !== false);
          show('Local media active');
          emit('joined', { callID: payload.callID });
        },

        async leave() {
          stopStream();
          show('Runtime ready');
          emit('left');
        },

        async setMuted(payload) {
          if (stream) stream.getAudioTracks().forEach(track => { track.enabled = !payload.muted; });
          emit('mutedChanged', { muted: Boolean(payload.muted) });
        },

        async setCameraEnabled(payload) {
          if (stream) stream.getVideoTracks().forEach(track => { track.enabled = Boolean(payload.enabled); });
          emit('cameraChanged', { enabled: Boolean(payload.enabled) });
        },

        async switchCamera() {
          const videoEnabled = Boolean(stream && stream.getVideoTracks().length);
          facingMode = facingMode === 'user' ? 'environment' : 'user';
          await acquire(videoEnabled);
          emit('cameraSwitched', { facingMode });
        },

        async setAudioSessionActive(payload) {
          emit('audioSessionChanged', { active: Boolean(payload.active) });
        }
      };

      window.CrossbarRuntime = {
        async receive(envelope) {
          const handler = commands[envelope.command];
          if (!handler) {
            emit('error', { message: `Unknown native command: ${envelope.command}` });
            return;
          }
          try {
            await handler(envelope.payload || {});
          } catch (error) {
            show('Media unavailable');
            emit('error', { message: `${error.name || 'Error'}: ${error.message || error}` });
          }
        }
      };

      show('Runtime ready');
      emit('runtimeReady');
    })();
  </script>
</body>
</html>
